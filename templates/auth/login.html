{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="card auth-card shadow-sm border-0">
  <div class="card-body p-4">
    <h3 class="mb-1"><i class="bi bi-mortarboard"></i> Sign in</h3>
    <p class="text-muted">Admin, examiners and students log in here.</p>
    <form method="post">
      <div class="mb-3"><label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required autofocus></div>
      <div class="mb-3"><label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required></div>
      <button class="btn btn-primary w-100">Login</button>
    </form>
    <hr>
    <div class="d-flex justify-content-between small">
      <a href="{{ url_for('auth.register', role='student') }}">Register as Student</a>
      <a href="{{ url_for('auth.register', role='examiner') }}">Register as Examiner</a>
    </div>
  </div>
</div>
{% endblock %}
