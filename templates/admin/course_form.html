{% extends "base.html" %}
{% block title %}{{ 'Edit' if course else 'New' }} course{% endblock %}
{% block content %}
<div class="card shadow-sm border-0 mx-auto" style="max-width:640px">
  <div class="card-header">{{ 'Edit course ' ~ course.code if course else 'New course' }}</div>
  <div class="card-body">
    <form method="post">
      <div class="row g-3">
        <div class="col-md-4"><label class="form-label">Course code *</label>
          <input name="code" class="form-control" required maxlength="20" value="{{ course.code if course else request.form.get('code','') }}"></div>
        <div class="col-md-8"><label class="form-label">Course name *</label>
          <input name="name" class="form-control" required value="{{ course.name if course else request.form.get('name','') }}"></div>
        <div class="col-12"><label class="form-label">Description</label>
          <textarea name="description" class="form-control" rows="3">{{ course.description if course else request.form.get('description','') }}</textarea></div>
        <div class="col-md-4"><label class="form-label">Credits</label>
          <input type="number" name="credits" min="0" max="40" class="form-control" value="{{ course.credits if course and course.credits is not none else '' }}"></div>
        <div class="col-md-4"><label class="form-label">Status</label>
          <select name="status" class="form-select">
            {% for s in ['Active','Inactive'] %}<option {% if course and course.status==s %}selected{% endif %}>{{ s }}</option>{% endfor %}
          </select></div>
      </div>
      <div class="mt-4">
        <button class="btn btn-primary">Save</button>
        <a href="{{ url_for('admin.courses') }}" class="btn btn-link">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
